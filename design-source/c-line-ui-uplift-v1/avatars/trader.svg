  <rect x="211" y="85" width="3" height="18" rx="1.5" fill="#6dc4d4" opacity="0.85"></rect>

  
  <path d="M54 161 h28 v7 a7 7 0 0 1 -7 7 h-14 a7 7 0 0 1 -7 -7 Z" fill="url(#foot-trader)" stroke="#6dc4d4" stroke-opacity="0.5" stroke-width="1.2"></path>
