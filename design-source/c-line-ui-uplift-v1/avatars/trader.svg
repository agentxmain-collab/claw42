  <rect x="10" y="20" width="200" height="148" rx="54" ry="54" fill="url(#shell-trader)" stroke="#6dc4d4" stroke-opacity="0.65" stroke-width="2.5" filter="url(#glow-trader)"></rect>

  
  <rect x="24" y="34" width="172" height="120" rx="42" ry="42" fill="url(#face-trader)" stroke="rgba(255,255,255,0.08)" stroke-width="1"></rect>

  
