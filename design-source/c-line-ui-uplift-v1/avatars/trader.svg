<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 190" role="img" aria-label="trader">
  <defs>
    <linearGradient id="shell-trader" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a2f8c"></stop>
      <stop offset="0.6" stop-color="#2d1664"></stop>
      <stop offset="1" stop-color="#170a3f"></stop>
    </linearGradient>
    <linearGradient id="ear-trader" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3aa8"></stop>
      <stop offset="1" stop-color="#2d1664"></stop>
    </linearGradient>
    <linearGradient id="foot-trader" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2275"></stop>
      <stop offset="1" stop-color="#1c0e4a"></stop>
    </linearGradient>
    <radialGradient id="face-trader" cx="0.5" cy="0.5" r="0.7">
